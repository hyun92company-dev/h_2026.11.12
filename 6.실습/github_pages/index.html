<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Pages Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(255,255,255,0.9);
        border-radius: 16px;
        padding: 40px 60px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        text-align: center;
      }
      h1 {
        margin-bottom: 12px;
        font-size: 2.2rem;
      }
      p {
        margin: 0;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>GitHub Pages</h1>
      <p>정상적으로 동작하는 HTML 페이지입니다.</p>
    </div>
  </body>
</html>
